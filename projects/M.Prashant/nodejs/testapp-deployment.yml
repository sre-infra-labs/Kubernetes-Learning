apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-web-app
  labels:
    app: web-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      containers:
      - name: my-web-app
        image: imajaydwivedi/webapp-demo:v4.0
        ports:
        - containerPort: 3000
