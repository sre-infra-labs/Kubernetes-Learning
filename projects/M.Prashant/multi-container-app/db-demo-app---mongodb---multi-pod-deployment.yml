apiVersion: apps/v1
kind: Deployment
metadata:
  # Unique name for the deployment
  name: mongo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo-app
  template:
    metadata:
      labels:
        # Apply this label to pods and default the Deployment label selector to this value
        app: mongo-app
    spec:
      containers:
      - name: mongo-app
        image: mongo:latest
        volumeMounts:
          - name: mongo-app-vol
            mountPath: /data/db
        # ports:
        # - containerPort: 27017
      volumes:
        - name: mongo-app-vol
          persistentVolumeClaim:
            claimName: mongo-app-pvc

---

apiVersion: v1
kind: Service
metadata:
  name: service-mongodb
spec:
  selector:
    # Loadbalance traffic across Pods matching this label selector
    app: mongo-app
  # type: LoadBalancer
  ports:
    # Accept traffic sent to port 27017
    - protocol: TCP
      port: 27017
      targetPort: 27017

