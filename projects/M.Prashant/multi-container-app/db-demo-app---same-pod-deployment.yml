apiVersion: apps/v1
kind: Deployment
metadata:
  # Unique name for the deployment
  name: my-nodedb-app
  labels:
    app: nodedb-app
spec:
  # 3 Pods should exist at any given time
  replicas: 2
  selector:
    matchLabels:
      app: nodedb-app
  template:
    metadata:
      labels:
        # Apply this label to pods and default the Deployment label selector to this value
        app: nodedb-app
    spec:
      containers:
      - name: nodedb-app
        image: imajaydwivedi/node-mongo-db:02
        # ports:
        # - containerPort: 3000
      - name: mongodb
        image: mongo:latest
        # ports:
        # - containerPort: 27017

---

apiVersion: v1
kind: Service
metadata:
  name: my-nodedb-app
spec:
  selector:
    # Loadbalance traffic across Pods matching this label selector
    app: nodedb-app
  type: LoadBalancer
  ports:
    # Accept traffic sent to port 80
    - protocol: TCP
      port: 80
      targetPort: 3000

